<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-label="Sig's Kitchen BBQ — two brothers cartoon placeholder">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A0F08"/>
      <stop offset="100%" stop-color="#0E0E0F"/>
    </linearGradient>
  </defs>
  <rect width="320" height="220" fill="url(#bgGrad)"/>
  <!-- Smoke rays -->
  <g opacity="0.15" fill="#F4B41A">
    <path d="M160 30 L150 0 L170 0 Z"/>
    <path d="M120 30 L110 5 L130 5 Z"/>
    <path d="M200 30 L190 5 L210 5 Z"/>
  </g>
  <!-- Brother 1 (left) -->
  <g transform="translate(95,75)">
    <circle cx="0" cy="0" r="38" fill="#F4B41A"/>
    <circle cx="0" cy="0" r="38" fill="none" stroke="#D72E1E" stroke-width="3"/>
    <!-- Beard -->
    <path d="M-22 8 Q0 35 22 8 Q22 25 0 30 Q-22 25 -22 8 Z" fill="#1A0F08"/>
    <!-- Sunglasses -->
    <rect x="-22" y="-6" width="44" height="9" fill="#1A0F08" rx="2"/>
    <rect x="-18" y="-4" width="14" height="5" fill="#1A0F08"/>
    <rect x="4" y="-4" width="14" height="5" fill="#1A0F08"/>
    <!-- Smile line -->
    <path d="M-8 18 Q0 22 8 18" stroke="#1A0F08" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Brother 2 (right) -->
  <g transform="translate(225,75)">
    <circle cx="0" cy="0" r="38" fill="#F4B41A"/>
    <circle cx="0" cy="0" r="38" fill="none" stroke="#D72E1E" stroke-width="3"/>
    <!-- Hair -->
    <path d="M-28 -10 Q0 -42 28 -10 L28 -25 Q0 -35 -28 -25 Z" fill="#1A0F08"/>
    <!-- Beard -->
    <path d="M-22 10 Q0 36 22 10 Q22 28 0 33 Q-22 28 -22 10 Z" fill="#1A0F08"/>
    <!-- Eyes -->
    <circle cx="-10" cy="-2" r="3" fill="#1A0F08"/>
    <circle cx="10" cy="-2" r="3" fill="#1A0F08"/>
    <!-- Smile -->
    <path d="M-8 16 Q0 22 8 16" stroke="#1A0F08" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Wordmark below -->
  <text x="160" y="175" text-anchor="middle" fill="#F4B41A" font-family="Alfa Slab One, Impact, sans-serif" font-size="22" letter-spacing="2">SIGS KITCHEN</text>
  <text x="160" y="200" text-anchor="middle" fill="#D72E1E" font-family="Alfa Slab One, Impact, sans-serif" font-size="14" letter-spacing="4">BARBECUE</text>
</svg>
